<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interval Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="container" id="app">

        <!-- Setup View -->
        <div id="setup-view" class="view active">
            <header>
                <h1>Interval Timer</h1>
                <p>コースを選んでください</p>
                <span class="version-tag">v1.3</span>
            </header>

            <div class="preset-list">
                <button class="preset-card" id="preset-light" data-work="50" data-rest="10">
                    <div class="preset-tag">LIGHT</div>
                    <div class="preset-times">
                        <span class="preset-work">50<small>s</small></span>
                        <span class="preset-sep">:</span>
                        <span class="preset-rest">10<small>s</small></span>
                    </div>
                    <div class="preset-label">ワーク : レスト</div>
                </button>

                <button class="preset-card" id="preset-standard" data-work="100" data-rest="20">
                    <div class="preset-tag">STANDARD</div>
                    <div class="preset-times">
                        <span class="preset-work">100<small>s</small></span>
                        <span class="preset-sep">:</span>
                        <span class="preset-rest">20<small>s</small></span>
                    </div>
                    <div class="preset-label">ワーク : レスト</div>
                </button>

                <button class="preset-card" id="preset-hard" data-work="150" data-rest="30">
                    <div class="preset-tag">HARD</div>
                    <div class="preset-times">
                        <span class="preset-work">150<small>s</small></span>
                        <span class="preset-sep">:</span>
                        <span class="preset-rest">30<small>s</small></span>
                    </div>
                    <div class="preset-label">ワーク : レスト</div>
                </button>
            </div>
        </div>

        <!-- Timer View -->
        <div id="timer-view" class="view">
            <div class="timer-header">
                <h2 id="phase-label">PREPARE</h2>
                <p id="round-label">Round 1</p>
            </div>

            <div class="timer-display-container">
                <svg class="progress-ring" viewBox="0 0 280 280" width="280" height="280">
                    <circle class="progress-ring__track" stroke="rgba(255,255,255,0.08)" stroke-width="14" fill="transparent" r="120" cx="140" cy="140"/>
                    <circle id="progress-ring" class="progress-ring__circle" stroke="#10b981" stroke-width="14" fill="transparent" r="120" cx="140" cy="140" stroke-linecap="round"/>
                </svg>
                <div class="time-display" id="time-left">0</div>
            </div>

            <div class="timer-controls">
                <button id="pause-btn" class="btn-secondary">PAUSE</button>
                <button id="stop-btn" class="btn-danger">STOP</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
